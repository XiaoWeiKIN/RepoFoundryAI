name: prepare-memory-runtime-once

on:
  push:
    branches: [feat/memory-cooling-runtime-90]

permissions:
  contents: write

concurrency:
  group: prepare-memory-runtime-once
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'XiaoWeiKIN/RepoHarnessKit' && github.ref == 'refs/heads/feat/memory-cooling-runtime-90'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Apply exact guarded edits
        run: python3 -B scripts/_prepare_memory_runtime_once.py
      - name: Exercise runtime policy and installed adapter paths
        run: python3 -B -m unittest discover -s tests -p test_memory_runtime.py -v
      - name: Commit only to the feature branch and remove this preparer
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=feat/memory-cooling-runtime-90
          current="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$current" = "$EXPECTED_HEAD"
          git diff --check
          git rm .github/workflows/p1b-prepare-once.yml scripts/_prepare_memory_runtime_once.py
          git add assets/core/engineering-specs/spec_router.py scripts/foundryctl.py tests/test_foundryctl.py tests/test_writing_routes.py references/bootstrap.md engineering-execution-plan/SKILL.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(memory): wire opt-in Core runtime and versioned installation'
          git push origin "HEAD:refs/heads/$branch"
