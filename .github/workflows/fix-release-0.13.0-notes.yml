name: fix-release-0.13.0-notes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-release-0.13.0-notes.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-release-0.13.0-notes.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --tags origin 'refs/tags/v0.13.0' 'refs/tags/v0.13.0^{}')"
          object="$(printf '%s\n' "$remote" | awk '$2=="refs/tags/v0.13.0" {print $1}')"
          peeled="$(printf '%s\n' "$remote" | awk '$2=="refs/tags/v0.13.0^{}" {print $1}')"
          test "$object" = "51f80df80172d2ded9b7e0f9e105a60a2c6059bd"
          test "$peeled" = "706d5218dec8b251fe78b7ea4cc62f81cc7d9378"

  fix:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Repair only the GitHub Release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Highlights

          - Adds source-bound Architecture HTML reading views for Detailed Design through `repofoundry.architecture-explanation/v1`.
          - Adds explicit source-file identities, order-independent source-set hashing, evidence/invariant/limitation surfaces, and offline English/Chinese rendering with hashed CSP.
          - Adds real-browser architecture-view smoke coverage on Ubuntu, Windows, and macOS while keeping the existing Spec-activation Explanation IR unchanged.

          ## Version contract

          - RepoFoundry distribution: 0.13.0
          - Harness schema: 3
          - Harness Core: 1.5.5
          - Codex adapter: 2.4.2
          - Claude adapter: 1.3.1
          - Portable adapter: 1.3.2
          - Activation protocol: 2
          - Default EngineeringSpecifications Catalog: 1.7.1

          Existing project Harness and Spec state remain explicit migrations; installing the distribution does not rewrite project manifests or locks.

          Release target: 706d5218dec8b251fe78b7ea4cc62f81cc7d9378

          Full Changelog: https://github.com/XiaoWeiKIN/RepoFoundryAI/compare/v0.12.0...v0.13.0
          EOF

          gh release edit v0.13.0             --title 'RepoFoundry AI 0.13.0'             --notes-file "$RUNNER_TEMP/release-notes.md"

          gh release view v0.13.0 --json tagName,name,isDraft,isPrerelease,body > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['tagName'] == 'v0.13.0'
          assert data['name'] == 'RepoFoundry AI 0.13.0'
          assert data['isDraft'] is False
          assert data['isPrerelease'] is False
          assert '`repofoundry.architecture-explanation/v1`' in data['body']
          assert 'Release target: 706d5218dec8b251fe78b7ea4cc62f81cc7d9378' in data['body']
          PY
