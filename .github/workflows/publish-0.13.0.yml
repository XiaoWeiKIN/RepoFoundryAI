name: publish-0.13.0

on:
  pull_request:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/publish-0.13.0.yml
      - README.md
      - README.zh-CN.md
      - references/bootstrap.md
      - references/upgrades.md
      - tests/test_repository_contracts.py
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/publish-0.13.0.yml
      - README.md
      - README.zh-CN.md
      - references/bootstrap.md
      - references/upgrades.md
      - tests/test_repository_contracts.py

permissions:
  contents: read

concurrency:
  group: publish-0.13.0-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  integrity:
    name: release integrity (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify distribution identity and canonical repository contract
        run: |
          test "$(cat VERSION)" = "0.13.0"
          python3 -B scripts/check.py

  frames:
    name: release explanation frames (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test tests/explanation_frames.test.mjs

  real-catalog:
    name: release real Catalog (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          path: rf
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: XiaoWeiKIN/EngineeringSpecifications
          ref: e2919c1d205372ad1d1c70808a000a7e80390c8b
          path: upstream-spec
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run consumers against published Catalog 1.7.1
        working-directory: rf
        env:
          RF_REAL_SPEC_REPO: ${{ github.workspace }}/upstream-spec
          RF_SPEC_ARTIFACT_DIR: ${{ runner.temp }}/rf-release-spec-evidence
        run: python3 -B tests/integration/test_documentation_catalog.py

  publish:
    name: publish v0.13.0
    needs: [integrity, frames, real-catalog]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'XiaoWeiKIN/RepoFoundryAI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.13.0
      PREVIOUS_TAG: v0.12.0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Publish only the verified release tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$GITHUB_SHA"
          test "$(cat VERSION)" = "0.13.0"
          git merge-base --is-ancestor e33688eea2f61c571dbcb2bd681fc0c8487c9be5 "$release_commit"

          mapfile -t remote_lines < <(git ls-remote --tags origin             "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          tag_object=""
          peeled=""
          for line in "${remote_lines[@]}"; do
            sha="${line%%$'\t'*}"
            ref="${line#*$'\t'}"
            if [[ "$ref" == "refs/tags/$RELEASE_TAG" ]]; then tag_object="$sha"; fi
            if [[ "$ref" == "refs/tags/$RELEASE_TAG^{}" ]]; then peeled="$sha"; fi
          done

          if [[ -n "$tag_object" ]]; then
            test -n "$peeled" || { echo "Existing $RELEASE_TAG is not annotated"; exit 1; }
            test "$peeled" = "$release_commit" || { echo "Existing $RELEASE_TAG targets $peeled, expected $release_commit"; exit 1; }
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          else
            git -c user.name='github-actions[bot]'                 -c user.email='41898282+github-actions[bot]@users.noreply.github.com'                 tag -a "$RELEASE_TAG" "$release_commit" -m 'RepoFoundry AI 0.13.0'
            git -c push.followTags=false push origin               "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi

          remote="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          remote_object="$(printf '%s\n' "$remote" | awk -v r="refs/tags/$RELEASE_TAG" '$2==r {print $1}')"
          remote_peeled="$(printf '%s\n' "$remote" | awk -v r="refs/tags/$RELEASE_TAG^{}" '$2==r {print $1}')"
          test -n "$remote_object"
          test "$remote_peeled" = "$release_commit"

          if gh release view "$RELEASE_TAG" --json tagName,name,isDraft,isPrerelease,url > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data['tagName'] != 'v0.13.0' or data['name'] != 'RepoFoundry AI 0.13.0' or data['isDraft'] or data['isPrerelease']:
              raise SystemExit('Existing GitHub Release does not match the approved stable release identity')
          PY
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Highlights

          - Adds source-bound Architecture HTML reading views for Detailed Design through `repofoundry.architecture-explanation/v1`.
          - Adds explicit source-file identities, order-independent source-set hashing, evidence/invariant/limitation surfaces, and offline English/Chinese rendering with hashed CSP.
          - Adds real-browser architecture-view smoke coverage on Ubuntu, Windows, and macOS while keeping the existing Spec-activation Explanation IR unchanged.

          ## Version contract

          - RepoFoundry distribution: 0.13.0
          - Harness schema: 3
          - Harness Core: 1.5.5
          - Codex adapter: 2.4.2
          - Claude adapter: 1.3.1
          - Portable adapter: 1.3.2
          - Activation protocol: 2
          - Default EngineeringSpecifications Catalog: 1.7.1

          Existing project Harness and Spec state remain explicit migrations; installing the distribution does not rewrite project manifests or locks.

          Release target: $release_commit

          Full Changelog: https://github.com/XiaoWeiKIN/RepoFoundryAI/compare/v0.12.0...v0.13.0
          EOF
            gh release create "$RELEASE_TAG" --verify-tag               --title 'RepoFoundry AI 0.13.0'               --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

          python3 install.py --version 0.13.0             --prefix "$RUNNER_TEMP/repofoundry-install"             --bin-dir "$RUNNER_TEMP/repofoundry-bin"             --host none --json > "$RUNNER_TEMP/install.json"
          python3 - "$RUNNER_TEMP/install.json" "$release_commit" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data['version'] != '0.13.0':
              raise SystemExit('Post-publication installer resolved the wrong version')
          if data.get('project_harnesses_modified') is not False:
              raise SystemExit('Installer unexpectedly reports project Harness modification')
          print(json.dumps({'release_commit': sys.argv[2], 'install': data}, indent=2))
          PY

          {
            echo '## RepoFoundry AI 0.13.0 published and verified'
            echo
            echo "- tag object: $remote_object"
            echo "- commit: $release_commit"
            echo '- isolated explicit-version installation: success'
          } >> "$GITHUB_STEP_SUMMARY"
