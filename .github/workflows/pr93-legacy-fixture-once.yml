name: pr93-legacy-fixture-once

on:
  push:
    branches: [feat/memory-cooling-runtime-90]
    paths: [.github/workflows/pr93-legacy-fixture-once.yml]

permissions:
  contents: read

jobs:
  repair-and-verify:
    if: github.repository == 'XiaoWeiKIN/RepoHarnessKit' && github.ref == 'refs/heads/feat/memory-cooling-runtime-90'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Apply exact source-guarded test fixture edits
        id: patch
        run: |
          git merge-base --is-ancestor 08f37beced1f8f6d69fb583f8723546d4a5f1ec9 HEAD
          python3 -B scripts/_pr93_legacy_fix_once.py
          git diff --check
      - name: Run migration, writing-route and runtime regressions
        if: steps.patch.outcome == 'success'
        run: python3 -B -m unittest tests.test_foundryctl tests.test_writing_routes tests.test_memory_upgrade tests.test_memory_runtime -v
      - name: Upgrade an actual Core 1.5.6 installation from the pinned old commit
        if: always() && steps.patch.outcome == 'success'
        run: python3 -B scripts/_pr93_legacy_fix_once.py --verify-actual
      - name: Commit guarded fixture edits and remove the temporary preparer
        if: always() && steps.patch.outcome == 'success'
        run: |
          set -euo pipefail
          git rm -- scripts/_pr93_legacy_fix_once.py .github/workflows/pr93-legacy-fixture-once.yml
          git add -- tests/test_foundryctl.py tests/test_writing_routes.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(harness): restore legacy file-set fixtures for Core 1.6 migration'
          git push origin HEAD:refs/heads/feat/memory-cooling-runtime-90
