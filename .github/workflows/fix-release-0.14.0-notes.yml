name: fix-release-0.14.0-notes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-release-0.14.0-notes.yml
      - .github/workflows/publish-0.14.0.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-release-0.14.0-notes.yml
      - .github/workflows/publish-0.14.0.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable v0.14.0 release identity
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --tags origin 'refs/tags/v0.14.0' 'refs/tags/v0.14.0^{}')"
          object="$(printf '%s\n' "$remote" | awk '$2=="refs/tags/v0.14.0" {print $1}')"
          peeled="$(printf '%s\n' "$remote" | awk '$2=="refs/tags/v0.14.0^{}" {print $1}')"
          test "$object" = "4eedea859dc2dd93da2c96f1e3d501693813c0bb"
          test "$peeled" = "3ec6af45549f29842f28872382aa121f0bb044f2"

  fix:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Repair only the GitHub Release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Highlights

          - Adds progressive, source-bound Benchmark explanation views for sealed Engineering Benchmark Runs through `repofoundry.benchmark-explanation/v1`.
          - Preserves predeclared predictions, falsifiers, and supported / falsified / inconclusive status while separating observation, derived result, hypothesis, and mechanism interpretation.
          - Requires sealed measurement + diagnostic + version-matched source evidence references before a claim can be rendered as a mechanism interpretation; the structural check does not certify causality.
          - Adds self-contained offline English/Chinese progressive HTML with five evidence stages and real-browser smoke coverage on Ubuntu, Windows, and macOS.
          - Keeps sealed Scenario/Result/artifacts immutable: the derived view cannot change the Benchmark outcome, invent unmeasured values, or create decision authority.

          ## Version contract

          - RepoFoundry distribution: 0.14.0
          - Harness schema: 3
          - Harness Core: 1.5.5
          - Codex adapter: 2.4.2
          - Claude adapter: 1.3.1
          - Portable adapter: 1.3.2
          - Activation protocol: 2
          - Default EngineeringSpecifications Catalog: 1.7.1

          Existing project Harness and Spec state remain explicit migrations; installing the distribution does not rewrite project manifests or locks.

          Release target: 3ec6af45549f29842f28872382aa121f0bb044f2

          Full Changelog: https://github.com/XiaoWeiKIN/RepoFoundryAI/compare/v0.13.0...v0.14.0
          EOF

          gh release edit v0.14.0             --title 'RepoFoundry AI 0.14.0'             --notes-file "$RUNNER_TEMP/release-notes.md"

          gh release view v0.14.0             --json tagName,name,isDraft,isPrerelease,body             > "$RUNNER_TEMP/release.json"

          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['tagName'] == 'v0.14.0'
          assert data['name'] == 'RepoFoundry AI 0.14.0'
          assert data['isDraft'] is False
          assert data['isPrerelease'] is False
          assert '`repofoundry.benchmark-explanation/v1`' in data['body']
          assert 'Release target: 3ec6af45549f29842f28872382aa121f0bb044f2' in data['body']
          PY
